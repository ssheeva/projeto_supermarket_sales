services:
  postgres:
    image: postgres:18
    container_name: postgres-loja
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-loja}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_loja_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-loja}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_loja_data:
